services:
  wordpress:
    image: wordpress:latest
    ports:
      - "8001:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: user_wp
      WORDPRESS_DB_PASSWORD: senha_do_portfolio
      WORDPRESS_DB_NAME: wp_site1
    volumes:
      - ./wp-content:/var/www/html/wp-content
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wp_site1
      MYSQL_USER: user_wp
      MYSQL_PASSWORD: senha_do_portfolio
      MYSQL_ROOT_PASSWORD: senha_do_portfolio
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
